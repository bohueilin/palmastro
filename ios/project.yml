# XcodeGen project spec for the PalmAstro iOS app (PRD §9, §48).
# Generate with:  xcodegen generate   (run inside ios/)
# Requires Xcode 15.4+ (iOS 17 SDK). Engines come from the local
# PalmAstroKit Swift package; the app layer under App/ is SwiftUI.
name: PalmAstro

options:
  bundleIdPrefix: com.palmastro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  PalmAstroKit:
    path: PalmAstroKit

targets:
  PalmAstro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/Legal/**"
      # Legal documents (PRD §13.8) must ship inside the bundle. XcodeGen
      # assigns .md files no build phase by default, so the Legal folder is
      # listed separately with an explicit resources phase.
      - path: App/Resources/Legal
        buildPhase: resources
    dependencies:
      - package: PalmAstroKit
        product: PalmAstroKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PalmAstro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Localized via App/Resources/*/InfoPlist.strings (en + zh-Hant).
        NSCameraUsageDescription: "PalmAstro uses the camera to scan your palm. Frames are analyzed on this device only and are never uploaded."
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CFBundleLocalizations:
          - en
          - zh-Hant
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team id before archiving for TestFlight:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

schemes:
  PalmAstro:
    build:
      targets:
        PalmAstro: all
    run:
      config: Debug
    archive:
      config: Release
