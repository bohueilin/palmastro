build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  ComplexCondition:
    active: true
    threshold: 4
  ComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true
  LargeClass:
    active: true
    threshold: 600
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    ignoreDeprecated: true
    ignorePrivate: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SleepInsteadOfDelay:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  PrintStackTrace:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'Test'
  MatchingDeclarationName:
    active: false

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCast:
    active: true
  UnsafeCallOnNullableType:
    active: true
  EqualsWithHashCodeExist:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  UnreachableCode:
    active: true

style:
  active: true
  ForbiddenComment:
    active: false
  MagicNumber:
    active: true
    excludes:
      - '**/test/**'
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeImportStatements: true
    excludeCommentStatements: true
  # Wildcard imports are the established convention in this codebase
  # (Compose material3.*, contracts.*, mockk.* across every module) —
  # enforcing the rule fights the repo's own style, so it is disabled.
  WildcardImport:
    active: false
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  UnusedImports:
    active: true
  VarCouldBeVal:
    active: true
  NewLineAtEndOfFile:
    active: true
